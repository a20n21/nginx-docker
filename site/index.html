<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Projeto DevOps - Nginx</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        h1 span {
            color: #00ffcc;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            margin-top: 15px;
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media(max-width: 600px){
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Projeto <span>DevOps</span></h1>

        <p>
            Aplicação rodando em container Docker com NGINX,
            pipeline automatizado no Jenkins
            e preparada para Kubernetes.
        </p>

        <div class="info">
            <h3>🔧 Stack do Projeto</h3>
            <p>✔ Docker</p>
            <p>✔ Jenkins CI</p>
            <p>✔ Kubernetes</p>
            <p>✔ GitHub</p>
        </div>

        <div class="badge">
            Deploy Automático Ativo ✅
        </div>

        <footer>
            Criado por Anderson Matias | 2026
        </footer>
    </div>
</body>
</html>
